name: Verilator CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Verilator version
        run: |
          docker run --rm verilator/verilator:5.052 --version

      - name: Run DFF testbench
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            verilator/verilator:5.052 \
            -c "python3 scripts/run.py dff"