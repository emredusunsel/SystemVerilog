# Separate entry in the Actions tab for optional width testing.
name: Verilator Width Sweep

# Run only when selected manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  width_sweep:
    # Each test and width combination gets its own Ubuntu machine.
    runs-on: ubuntu-latest
    strategy:
      # Continue testing the other combinations if one fails.
      fail-fast: false
      matrix:
        # Give each test its own set of widths.
        include:
          - test: counter
            width: 2
          - test: counter
            width: 4
          - test: counter
            width: 8
          - test: register
            width: 4
          - test: register
            width: 8
          - test: register
            width: 16
    # Each combination checks out the code, then builds and runs its test.
    steps:
      - name: Checkout repository
        # Download the selected branch onto this job's machine.
        uses: actions/checkout@v5

      # matrix.test and matrix.width identify this job's test and width.
      - name: Run ${{ matrix.test }} test at width ${{ matrix.width }}
        # Run Verilator in the same fixed Docker image as the default tests.
        # The width argument makes run.py pass -GWIDTH to Verilator.
        # The testbench file is not edited; a failed test fails this job.
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            verilator/verilator:v5.052@sha256:a5b73e2fce0b2c483396f3800940f33b6faa802331a061c21694dd27b7352120 \
            -c "verilator --version && python3 scripts/run.py ${{ matrix.test }} ${{ matrix.width }}"
